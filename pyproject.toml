[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartenergy-cyber"
version = "0.1.0"
description = "SmartEnergy Cyber-Resilience Analyzer — прототип магістерської роботи"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analyzer = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
smartenergy-emulator = "src.emulator.cli:main"
smartenergy-analyzer = "src.analyzer.cli:main"
smartenergy-normalizer = "src.normalizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # помилки pycodestyle
    "W",    # попередження pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # правила Ruff
]
ignore = [
    "E501",   # довжина рядка
    "SIM108", # ternary
    "RUF012", # mutable class default
    "B008",   # значення за замовчуванням в argparse
    "UP007",  # X | Y union syntax
    "UP017",  # datetime.UTC alias (ламає сумісність)
    "RUF001", # неоднозначний unicode у рядку (навмисно: ×, → тощо)
    "RUF002", # неоднозначний unicode у docstring
    "RUF003", # неоднозначний unicode у коментарях
    "B905",   # zip без strict для сумісності з Python 3.11
    "B007",   # невикористана змінна циклу
    "UP042",  # replace-str-enum
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: тести, яким потрібен повний запуск емулятора (виключити через -m 'not slow')",
    "external: тести, що потребують зовнішніх сервісів або системних binary",
    "component_adapters: тести шару адаптерів",
    "component_analyzer: тести шару аналізатора",
    "component_api: тести API-шару",
    "component_contracts: тести контрактів і схем",
    "component_db: тести інтеграції з базою даних",
    "component_emulator: тести шару емулятора",
    "component_normalizer: тести шару нормалізатора",
    "component_pipeline: тести багатокрокових конвеєрів",
    "component_shared: тести спільних утиліт",
    "type_api: тести API-ендпоінтів і поведінки API",
    "type_cli: тести CLI-аргументів і точок входу",
    "type_contract: тести інтерфейсів і контрактів даних",
    "type_e2e: end-to-end сценарії closed-loop системи",
    "type_integration: інтеграційні тести між кількома модулями",
    "type_resilience: тести стійкості до відмов і невалідних даних",
    "type_smoke: швидкі smoke-перевірки для CI",
    "type_unit: сфокусовані unit-тести",
    "priority_p0: найвищий пріоритет smoke/regression перевірок",
    "priority_p1: високий пріоритет інтеграційних і contract перевірок",
    "priority_p2: звичайні unit і support перевірки",
    "priority_p3: низький пріоритет і перевірки зовнішнього середовища",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

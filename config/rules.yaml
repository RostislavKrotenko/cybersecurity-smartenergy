# Активні правила інтегрованого контуру Smart Energy.
#
# У production-профілі залишаються лише правила, для яких загальний
# Docker Compose надає реальні події: захисні події Gateway, MQTT-
# телеметрію та повідомлення про недоступність захищеного контуру.
# Емулятор може підтримувати додаткові дослідницькі сценарії, але вони
# не оголошуються активними можливостями інтегрованої системи.

rules:
  - id: RULE-DDOS-001
    name: "Перевищення інтенсивності API-запитів"
    threat_type: availability_attack
    description: >
      Виявляє серію подій rate_exceeded, сформованих захисним Gateway
      під час перевищення дозволеної інтенсивності запитів.
    enabled: true

    match:
      event: rate_exceeded
      group_by: [source]

    window_sec: 30
    threshold: 10
    severity: critical
    confidence: 0.90

    sub_rules:
      - id: RULE-DDOS-002
        name: "API flood із впливом на сервіс"
        description: >
          Підвищує впевненість, якщо разом із API flood Gateway
          фіксує деградацію або відмову захищеного сервісу.
        match:
          event: service_status
          key: status
          values: [degraded, down]
          precondition: >
            RULE-DDOS-001 спрацювало протягом 120 секунд
            для того самого source
        severity: critical
        confidence: 0.98
        response_hint: activate_ddos_mitigation

    response_hint: rate_limit_and_block_source

  - id: RULE-SPOOF-001
    name: "Аномалія MQTT-телеметрії"
    threat_type: integrity_attack
    description: >
      Виявляє фізично недопустимі значення або різкі зміни напруги
      та потужності у нормалізованій MQTT-телеметрії Smart Energy.
    enabled: true

    match:
      event: telemetry_read
      group_by: [source, key]

    bounds:
      voltage:
        min: 180.0
        max: 280.0
        unit: V
      power_kw:
        min: -10.0
        max: 100.0
        unit: kW

    delta:
      voltage: 50.0
      power_kw: 30.0

    window_sec: 60
    threshold: 3
    severity: medium
    confidence: 0.75

    sub_rules:
      - id: RULE-SPOOF-002
        name: "Тривала аномалія MQTT-телеметрії"
        description: >
          Підвищує критичність після щонайменше п'яти аномальних
          значень одного показника.
        match:
          precondition: >
            RULE-SPOOF-001 count >= 5 протягом 120 секунд
        severity: high
        confidence: 0.90
        response_hint: operator_review

    response_hint: flag_for_review

  - id: RULE-OUT-001
    name: "Недоступність захищеного контуру"
    threat_type: outage
    description: >
      Виявляє фактичну недоступність Gateway або upstream за подіями
      Collector і захисного reverse proxy. Перевірки зовнішніх БД та
      endpoint відображаються окремо як read-only availability.
    enabled: true

    match:
      event: service_status
      values:
        - degraded
        - down
        - unavailable
        - upstream_timeout
        - upstream_unavailable
        - upstream_isolated
        - gateway_not_ready
      group_by: [source]

    window_sec: 60
    threshold: 1
    severity: high
    severity_override:
      - {value: down, severity: critical}
      - {value: upstream_unavailable, severity: critical}
    confidence: 0.90
    response_hint: monitor_controlled_recovery

detector_defaults:
  max_alerts_per_minute: 100
  dedup_window_sec: 10
  min_confidence: 0.5

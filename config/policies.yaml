# Порівняльні політики кіберстійкості інтегрованого Smart Energy.
#
# Політики є аналітичними профілями одного експерименту. Вони не перемикають
# конфігурацію запущеного Gateway, а змінюють чутливість правил і розрахункові
# MTTD, MTTR та вплив інцидентів. У профілях залишено лише механізми, які
# реально присутні в інтеграції: захист HTTP-контуру, контроль MQTT-
# телеметрії, моніторинг доступності та автоматизоване відновлення.

policies:
  minimal:
    name: "Мінімальна"
    description: >
      Найменш чутливий аналітичний профіль. Події збираються і журналюються,
      але для створення інциденту потрібна більша інтенсивність або довша
      серія аномалій. Реагування та відновлення моделюються як повільні.

    controls:
      event_logging:
        enabled: true
      availability_monitoring:
        enabled: true
      gateway_rate_limiting:
        enabled: false
      automatic_source_blocking:
        enabled: false
      mqtt_quarantine:
        enabled: false
      circuit_breaker:
        enabled: false
      stale_cache:
        enabled: false
      automated_recovery:
        enabled: false

    modifiers:
      availability_attack:
        prob_multiplier: 1.8
        impact_multiplier: 1.5
        mttd_multiplier: 2.0
        mttr_multiplier: 2.5
        threshold_multiplier: 2.0
        window_multiplier: 0.5

      integrity_attack:
        prob_multiplier: 1.4
        impact_multiplier: 1.6
        mttd_multiplier: 3.0
        mttr_multiplier: 2.0
        threshold_multiplier: 1.5
        window_multiplier: 0.8

      outage:
        prob_multiplier: 1.2
        impact_multiplier: 1.5
        mttd_multiplier: 1.5
        mttr_multiplier: 2.5
        threshold_multiplier: 1.0
        window_multiplier: 1.0

  baseline:
    name: "Базова"
    description: >
      Опорний профіль із базовими порогами активних правил. Порівняльні
      MTTD, MTTR, ймовірність та вплив використовують множник 1.0.

    controls:
      event_logging:
        enabled: true
      availability_monitoring:
        enabled: true
      gateway_rate_limiting:
        enabled: true
      automatic_source_blocking:
        enabled: false
      mqtt_quarantine:
        enabled: true
      circuit_breaker:
        enabled: true
      stale_cache:
        enabled: true
      automated_recovery:
        enabled: false

    modifiers:
      availability_attack:
        prob_multiplier: 1.0
        impact_multiplier: 1.0
        mttd_multiplier: 1.0
        mttr_multiplier: 1.0
        threshold_multiplier: 1.0
        window_multiplier: 1.0

      integrity_attack:
        prob_multiplier: 1.0
        impact_multiplier: 1.0
        mttd_multiplier: 1.0
        mttr_multiplier: 1.0
        threshold_multiplier: 1.0
        window_multiplier: 1.0

      outage:
        prob_multiplier: 1.0
        impact_multiplier: 1.0
        mttd_multiplier: 1.0
        mttr_multiplier: 1.0
        threshold_multiplier: 1.0
        window_multiplier: 1.0

  standard:
    name: "Стандартна"
    description: >
      Найчутливіший профіль: нижчі пороги, ширші вікна кореляції та коротші
      модельні часи виявлення і відновлення. Враховує повний набір реально
      реалізованих механізмів Gateway, MQTT-карантину й відновлення.

    controls:
      event_logging:
        enabled: true
      availability_monitoring:
        enabled: true
      gateway_rate_limiting:
        enabled: true
      automatic_source_blocking:
        enabled: true
      mqtt_quarantine:
        enabled: true
      circuit_breaker:
        enabled: true
      stale_cache:
        enabled: true
      automated_recovery:
        enabled: true

    modifiers:
      availability_attack:
        prob_multiplier: 0.2
        impact_multiplier: 0.3
        mttd_multiplier: 0.4
        mttr_multiplier: 0.3
        threshold_multiplier: 0.5
        window_multiplier: 2.0

      integrity_attack:
        prob_multiplier: 0.4
        impact_multiplier: 0.4
        mttd_multiplier: 0.5
        mttr_multiplier: 0.5
        threshold_multiplier: 0.7
        window_multiplier: 1.5

      outage:
        prob_multiplier: 0.5
        impact_multiplier: 0.5
        mttd_multiplier: 0.4
        mttr_multiplier: 0.4
        threshold_multiplier: 0.8
        window_multiplier: 1.2
